[package]
name = "charles-local-mcp"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Local, profile-driven Charles Proxy automation over CLI and MCP"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Eason0in/charles-local-mcp"
homepage = "https://github.com/Eason0in/charles-local-mcp"
documentation = "https://docs.rs/charles-local-mcp"
readme = "README.md"
keywords = ["mcp", "charles-proxy", "android", "testing", "automation"]
categories = ["development-tools::testing", "command-line-utilities"]
include = [
    "/Cargo.lock",
    "/Cargo.toml",
    "/LICENSE-APACHE",
    "/LICENSE-MIT",
    "/README.md",
    "/docs/**",
    "/fixtures/**",
    "/src/**",
    "/tests/**",
]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
fs2 = "0.4"
quick-xml = "0.41"
rmcp = { version = "3.1.3", default-features = false, features = ["macros", "server", "transport-io"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
time = { version = "0.3", features = ["formatting", "serde"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std"] }
toml = "0.9"
url = "2"
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = "thin"
